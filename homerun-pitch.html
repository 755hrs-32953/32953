<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>32953 — HOMERUN PITCH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{--gold:#ffcc00;--green:#44ff88;--red:#ff4444;--cyan:#54ffff;--purple:#7b68ee;--dark:#4a3fa0;--bg:#0a0a1a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-family:'Press Start 2P',monospace;position:fixed;top:0;left:0;right:0;bottom:0;}
  #app{width:380px;background:var(--bg);display:flex;flex-direction:column;position:relative;
    overflow:hidden;border:3px solid var(--dark);box-shadow:0 0 40px #7b68ee44;}
  #header{background:var(--purple);border-bottom:4px solid var(--dark);padding:6px 12px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #logo{font-size:13px;color:#fff;letter-spacing:3px;text-shadow:2px 2px 0 var(--dark);}
  #game-label{font-size:10px;color:#d4c0ff;letter-spacing:2px;}
  #game-wrap{flex:1;position:relative;overflow:hidden;min-height:0;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #overlay{position:absolute;inset:0;background:rgba(0,0,20,0.95);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:20;padding:16px;gap:8px;}
  .ov-title{font-size:18px;color:#fff;letter-spacing:3px;text-align:center;
    text-shadow:3px 3px 0 var(--dark);line-height:1.8;margin-bottom:4px;}
  .ov-sub{font-size:9px;color:#b8a8ff;letter-spacing:2px;margin-bottom:8px;text-align:center;}
  .ov-rule{font-size:9px;color:var(--cyan);letter-spacing:1px;text-align:center;line-height:2.4;}
  .ov-rule span{color:var(--gold);}
  .big-btn{font-family:'Press Start 2P',monospace;font-size:11px;padding:11px 28px;
    background:var(--gold);color:#000;border:3px solid #fff;cursor:pointer;letter-spacing:2px;
    box-shadow:4px 4px 0 var(--dark);margin-top:8px;}
  .big-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--dark);}
  #botbar{background:var(--purple);border-top:4px solid var(--dark);padding:4px 10px;
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .bot-item{font-size:9px;color:#d4c0ff;letter-spacing:1px;}
  .bot-val{color:var(--gold);}
</style>
</head>
<body>
<div id="app">
  <div id="header"><div id="logo">32953</div><div id="game-label">HOMERUN PITCH</div></div>
  <div id="game-wrap"><canvas id="c"></canvas><div id="overlay"></div></div>
  <div id="botbar">
    <div class="bot-item">PITCH: <span class="bot-val" id="bot-pitch">—</span></div>
    <div class="bot-item">HR: <span class="bot-val" id="bot-hr">0</span></div>
    <div class="bot-item">DIST: <span class="bot-val" id="bot-dist">0 FT</span></div>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),wrap=document.getElementById('game-wrap');
function fixH(){const a=document.getElementById('app');a.style.height=a.style.maxHeight=window.innerHeight+'px';}
fixH();
window.addEventListener('resize',()=>{fixH();resize();});
window.addEventListener('orientationchange',()=>setTimeout(fixH,200));
function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;}
resize();

const C={gold:'#ffcc00',green:'#44ff88',red:'#ff4444',cyan:'#54ffff',dirt:'#8b6040',dirtDk:'#6b4820'};

// ── PITCH TYPES ───────────────────────────────────────────────
const PT={
  FASTBALL:{name:'FASTBALL',mph:100,col:'#ff5454',perfectTime:.437,winPerfect:.017,winGood:.070,travel:.60},
  CHANGEUP:{name:'CHANGEUP',mph:90, col:'#ffaa00',perfectTime:.529,winPerfect:.020,winGood:.085,travel:.72},
  CURVEBALL:{name:'CURVEBALL',mph:80,col:'#54ffff',perfectTime:.633,winPerfect:.023,winGood:.100,travel:.85},
};

// ── PRE-SEEDED CROWD ──────────────────────────────────────────
const CROWD=[];
for(let i=0;i<400;i++) CROWD.push({
  rx:((i*137.508+.5)%1), ry:((i*97.312+.5)%1),
  shirt:['#cc3333','#3355cc','#887733','#cc7722','#33cc88','#aa33aa','#dddddd','#ddcc33','#336688','#cc5533'][i%10],
  hat:['#221133','#112233','#221111','#111111','#113322','#221122','#332211','#111122'][i%8],
  skin:['#dba876','#c88b55','#e8c090','#a06030'][i%4],
});

const FOUL_FANS=[];
for(let r=0;r<=28;r++){
  for(let c=0;c<60;c++){
    if(Math.random()<0.18)continue;
    FOUL_FANS.push({
      r:r/28, cIdx:c,
      shirt:['#cc3333','#3355cc','#eeeeee','#cc7722','#33cc88','#ddcc33'][Math.floor(Math.random()*6)],
      skin:['#dba876','#c88b55','#e8c090','#a06030'][Math.floor(Math.random()*4)]
    });
  }
}
FOUL_FANS.sort((a,b)=>b.r-a.r); 

// ── STATE ─────────────────────────────────────────────────────
let phase='idle';
let pitchNum=0,totalDist=0,hrCount=0,pitchResults=[];
let curPitch=null,pitchElapsed=0,swingTime=null,swingResult=null;
let ballCurve=0;
let fb={};
let flightLanded=false,flightTime=0;
let lastTime=0,windup=0;
let batterSwing=false,batterSwingT=0;
let flashMsg='',flashCol=C.gold,flashAlpha=0;
let confetti=[];
let celebrating=false;

function showOv(html){const o=document.getElementById('overlay');o.innerHTML=html;o.style.display='flex';}
function hideOv(){document.getElementById('overlay').style.display='none';}
function updBot(){
  document.getElementById('bot-pitch').textContent=pitchNum>0?pitchNum+'/10':'—';
  document.getElementById('bot-hr').textContent=hrCount;
  document.getElementById('bot-dist').textContent=totalDist+' FT';
}

function pickPitch(){
  const p=['FASTBALL','FASTBALL','FASTBALL','CHANGEUP','CHANGEUP','CURVEBALL'];
  return PT[p[Math.floor(Math.random()*p.length)]];
}

function startPitch(){
  if(pitchNum>=10){showSummary();return;}
  pitchNum++;curPitch=pickPitch();
  swingTime=null;swingResult=null;pitchElapsed=0;windup=0;
  batterSwing=false;batterSwingT=0;
  flightLanded=false;flightTime=0;fb={};
  confetti=[];celebrating=false;
  phase='ready';updBot();
}

function releasePitch(){pitchElapsed=0;ballCurve=0;phase='pitching';}

function handleTap(){
  if(phase==='ready'){windup=0;phase='windup';return;}
  if(phase==='pitching'){doSwing();return;}
}

function doSwing(){
  if(phase!=='pitching'||swingTime!==null)return;
  swingTime=pitchElapsed;batterSwing=true;batterSwingT=0;
  const diff=Math.abs(swingTime-curPitch.perfectTime);
  const early=swingTime<curPitch.perfectTime;
  if(diff<=curPitch.winPerfect)         swingResult='hr';
  else if(diff<=curPitch.winGood)       swingResult='fly';
  else if(diff<=curPitch.winGood*1.85)  swingResult='foul';
  else                                   swingResult='miss';
  triggerHit(early);
}

function triggerHit(early){
  if(swingResult==='miss'){
    setFlash('SWING AND A MISS!',C.red);
    pitchResults.push({r:'miss',d:0});updBot();
    setTimeout(startPitch,1500);phase='pitching_idle';return;
  }
  const diff=Math.abs(swingTime-curPitch.perfectTime);
  let dist=0,isHR=false,isFoul=false;
  if(swingResult==='hr'){
    dist=Math.round(450+(1-diff/curPitch.winPerfect)*50);
    if(curPitch.mph===100)dist=Math.min(500,dist+5);
    isHR=true;
  } else if(swingResult==='fly'){
    dist=Math.round(240+(1-(diff-curPitch.winPerfect)/(curPitch.winGood-curPitch.winPerfect))*160);
  } else {
    dist=Math.round(60+Math.random()*100);isFoul=true;
  }
  pitchResults.push({r:swingResult,d:dist});updBot();
  let angle;
  if(isFoul){angle=early?(Math.random()*.12):(0.88+Math.random()*.12);}
  else{const ac=0.5+(early?-.15:.15);angle=Math.max(.05,Math.min(.95,ac+(Math.random()-.5)*.22));}
  fb={dist,angle,isHR,isFoul,duration:1.3+dist/260};
  flightTime=0;flightLanded=false;
  phase='ballFlight';
}

function setFlash(msg,col){flashMsg=msg;flashCol=col;flashAlpha=1;}
function spawnConfetti(){
  for(let i=0;i<50;i++) confetti.push({
    x:Math.random(),y:.02+Math.random()*.28,
    vx:(Math.random()-.5)*.14,vy:-(0.2+Math.random()*.4),
    life:1,col:[C.gold,C.green,C.cyan,'#ff5454','#fff','#ffaa00'][i%6],
  });
}

function gPitch(){
  const W=canvas.width,H=canvas.height;
  const batterY=H*.80;    
  const moundY=H*.25;  
  const pitcherY=moundY-6;      
  return{W,H,pitcherY,batterY,moundY};
}

// ── PROGRESSIVE FIELD GEOMETRY (Separated Base and Height) ────
function gStad(){
  const W=canvas.width,H=canvas.height;
  const px=W*.50,py=H*.88;
  const w=[
    {x:-10,   y:H*.480, h:H*.080, ft:''},
    {x:W*.04, y:H*.480, h:H*.080, ft:325},  // LF pole
    {x:W*.28, y:H*.430, h:H*.080, ft:''},   // High wall ends
    {x:W*.28, y:H*.430, h:H*.035, ft:''},   // High wall drop
    {x:W*.40, y:H*.400, h:H*.035, ft:370},  // LC
    {x:W*.50, y:H*.380, h:H*.035, ft:400},  // CF
    {x:W*.80, y:H*.420, h:H*.035, ft:375},  // RF gap
    {x:W*.96, y:H*.500, h:H*.035, ft:325},  // RF pole
    {x:W+10,  y:H*.500, h:H*.035, ft:''},
  ];
  const diam=H*.20;
  const s2x=px,s2y=py-diam;
  const s1x=px+diam*.52,s1y=py-diam*.50;
  const s3x=px-diam*.52,s3y=py-diam*.50;
  const mx=px,my=(py+s2y)/2;
  return{W,H,px,py,wall:w,s1x,s1y,s2x,s2y,s3x,s3y,mx,my};
}

// Raycast against the wall to find base (y) and height (h) at any angle
function wallAt(t,w){
  const tx = w[0].x + t * (w[w.length-1].x - w[0].x);
  for(let i=0; i<w.length-1; i++){
    const dx = w[i+1].x - w[i].x;
    if(dx > 0 && tx >= w[i].x && tx <= w[i+1].x + 0.1){
      const st = (tx - w[i].x) / dx;
      return {
        x: tx, 
        y: w[i].y + st*(w[i+1].y - w[i].y),
        h: w[i].h + st*(w[i+1].h - w[i].h)
      };
    } else if (dx === 0 && Math.abs(tx - w[i].x) < 0.1) {
      return {x: tx, y: w[i].y, h: Math.max(w[i].h, w[i+1].h)};
    }
  }
  const last = w[w.length-1];
  return {x: last.x, y: last.y, h: last.h};
}

// ── PITCH VIEW (Strict Infield) ──────────────────────────────
function drawPitchView(){
  const{W,H,pitcherY,batterY,moundY}=gPitch();

  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#176017');grad.addColorStop(.5,'#1a6e1a');grad.addColorStop(1,'#0e400e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  for(let i=0;i<18;i++){
    const y1=H*(i/18),y2=H*((i+.5)/18);
    ctx.fillStyle=i%2===0?'rgba(30,110,30,.18)':'rgba(10,50,10,.10)';
    ctx.fillRect(0,y1,W,y2-y1);
  }

  const hpx=W*.5, hpy=batterY+20;
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(hpx,hpy);ctx.lineTo(hpx-H,hpy-H);ctx.stroke(); 
  ctx.beginPath();ctx.moveTo(hpx,hpy);ctx.lineTo(hpx+H,hpy-H);ctx.stroke(); 
  ctx.setLineDash([]);

  ctx.fillStyle='#7a5028';
  ctx.beginPath();ctx.ellipse(hpx,hpy+4,W*.13,H*.055,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(hpx,hpy-9);ctx.lineTo(hpx+9,hpy);
  ctx.lineTo(hpx+9,hpy+6);ctx.lineTo(hpx-9,hpy+6);ctx.lineTo(hpx-9,hpy);ctx.closePath();ctx.fill();
  
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1;
  ctx.strokeRect(hpx-38,hpy-18,20,28);
  ctx.strokeRect(hpx+18,hpy-18,20,28);

  ctx.fillStyle='#c88b55'; 
  ctx.beginPath();ctx.ellipse(W*.5,moundY,W*.12,H*.035,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a06030';
  ctx.beginPath();ctx.ellipse(W*.5,moundY,W*.05,H*.015,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#eee';ctx.fillRect(W*.5-6,moundY-2,12,3);

  drawPitcher(W*.5, moundY-4);

  if((phase==='pitching'||phase==='pitching_idle')&&swingTime===null){
    const tPct=Math.min(pitchElapsed/curPitch.travel,1);
    const bx=W*.5+ballCurve;
    const by=pitcherY+(batterY-pitcherY)*tPct;
    const bSz=2.5+tPct*6.5;
    
    const toY=t=>pitcherY+(batterY-pitcherY)*t;
    const p0=(curPitch.perfectTime-curPitch.winGood)/curPitch.travel;
    const p1=(curPitch.perfectTime+curPitch.winGood)/curPitch.travel;
    const p2=(curPitch.perfectTime-curPitch.winPerfect)/curPitch.travel;
    const p3=(curPitch.perfectTime+curPitch.winPerfect)/curPitch.travel;
    
    ctx.fillStyle='rgba(255,255,0,.05)';
    ctx.fillRect(0,toY(Math.max(0,p0)),W,toY(Math.min(1,p1))-toY(Math.max(0,p0)));
    ctx.fillStyle='rgba(255,255,0,.20)';
    ctx.fillRect(0,toY(Math.max(0,p2)),W,toY(Math.min(1,p3))-toY(Math.max(0,p2)));
    
    ctx.shadowColor='#ffffd0';ctx.shadowBlur=10;
    ctx.fillStyle='#f5f5d8';ctx.beginPath();ctx.arc(bx,by,bSz,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#cc3333';ctx.lineWidth=.8;
    ctx.beginPath();ctx.arc(bx-bSz*.25,by,bSz*.55,-.6,.6);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+bSz*.25,by,bSz*.55,Math.PI-.6,Math.PI+.6);ctx.stroke();
  }

  drawBatter(hpx - 22, hpy - 5);
  drawCatcher(hpx, hpy + 25);

  drawPitchHUD(W,H);
  drawFlash(W,H,.50);

  if(phase==='ready'){
    ctx.fillStyle='rgba(0,0,20,.75)';ctx.fillRect(W*.04,H*.54,W*.92,36);
    ctx.strokeStyle=C.cyan;ctx.lineWidth=2;ctx.strokeRect(W*.04,H*.54,W*.92,36);
    if(Math.floor(Date.now()/520)%2===0){
      ctx.fillStyle=C.cyan;ctx.font="9px 'Press Start 2P'";
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('TAP — READY FOR PITCH?',W*.5,H*.54+18);
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
    }
  }
}

function drawPitcher(cx,cy){
  const s=Math.max(1.5,Math.floor(canvas.width/100));
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));
  ctx.fillStyle='#cc2222';ctx.fillRect(-s*2,-s*10,s*4,s*2);ctx.fillRect(-s*3,-s*9,s*6,s);
  ctx.fillStyle='#dba876';ctx.fillRect(-s*2,-s*8,s*4,s*4);
  ctx.fillStyle='#dddddd';ctx.fillRect(-s*3,-s*4,s*6,s*7);
  ctx.fillStyle='#cc2222';ctx.fillRect(-s,-s*3,s*2,s*5);
  ctx.fillStyle='#5a2a00';ctx.fillRect(-s*6,-s*3,s*3,s*2);
  ctx.beginPath();ctx.arc(-s*6,-s*2,s*2,0,Math.PI*2);ctx.fill();
  const ar=(phase==='windup')?windup:0;
  ctx.fillStyle='#dba876';ctx.fillRect(s*3,-s*3,s*2,s*3+s*4*ar);
  if(phase==='windup'&&windup>.3){
    const tipY=-s*3-s*4*ar;
    ctx.fillStyle='#f5f5d8';ctx.beginPath();ctx.arc(s*4+s,tipY,s*1.2,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#888';ctx.fillRect(-s*3,s*3,s*2,s*5);ctx.fillRect(s,s*3,s*2,s*5);
  ctx.fillStyle='#111';ctx.fillRect(-s*3,s*8,s*3,s);ctx.fillRect(s,s*8,s*3,s);
  ctx.restore();
}

function drawBatter(cx,cy){
  const p=Math.max(1.5, canvas.width/180); 
  const sw=batterSwing?Math.min(batterSwingT/.22,1):0;
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));

  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(0, p*2, p*12, p*4, 0, 0, Math.PI*2);ctx.fill();

  if(sw > 0) {
    ctx.fillStyle='#c8c8e0'; ctx.fillRect(p*4, -p*12, p*5, p*12);
    ctx.fillStyle='#222'; ctx.fillRect(p*4, 0, p*6, p*3); 

    ctx.fillStyle='#e8e8f0'; ctx.fillRect(-p*6, -p*12, p*5, p*12);
    ctx.fillStyle='#222'; ctx.fillRect(-p*8, 0, p*6, p*3); 

    ctx.fillStyle='#e8e8f0'; ctx.fillRect(-p*5, -p*26, p*11, p*14);
    ctx.fillStyle='#222'; ctx.fillRect(-p*5, -p*13, p*11, p*2); 
    ctx.fillStyle='#6666cc'; ctx.fillRect(p*1, -p*22, p*4, p*6); 

    ctx.fillStyle='#dba876'; ctx.fillRect(-p*3, -p*32, p*6, p*6); 
    ctx.fillStyle='#1a1a55';
    ctx.beginPath();ctx.arc(0, -p*32, p*5.5, Math.PI, 0);ctx.fill(); 
    ctx.fillRect(-p*7, -p*33, p*8, p*2); 
    ctx.fillRect(-p*1, -p*33, p*5, p*6); 

    const batA = -0.75 + sw * 3.0;
    ctx.save();ctx.translate(p*6, -p*20);ctx.rotate(batA);
    ctx.fillStyle='#c87840'; ctx.fillRect(-p*1.5, 0, p*3, p*26); 
    ctx.fillStyle='#a05820'; ctx.fillRect(-p*2.5, p*12, p*5, p*14); 
    ctx.restore();

    ctx.fillStyle='#dba876';
    ctx.fillRect(-p*6, -p*23, p*8, p*4); 
    ctx.fillRect(p*3, -p*24, p*4, p*6); 

  } else {
    ctx.fillStyle='#e8e8f0'; ctx.fillRect(-p*6, -p*12, p*5, p*12);
    ctx.fillStyle='#222'; ctx.fillRect(-p*7, 0, p*6, p*3); 
    
    ctx.fillStyle='#c8c8e0'; ctx.fillRect(p*2, -p*12, p*5, p*12); 
    ctx.fillStyle='#222'; ctx.fillRect(p*2, 0, p*6, p*3); 

    ctx.fillStyle='#e8e8f0'; ctx.fillRect(-p*5, -p*26, p*11, p*14); 
    ctx.fillStyle='#222'; ctx.fillRect(-p*5, -p*13, p*11, p*2); 
    ctx.fillStyle='#6666cc'; ctx.fillRect(-p*2, -p*22, p*4, p*6); 

    ctx.fillStyle='#e8e8f0'; ctx.fillRect(-p*7, -p*25, p*4, p*7);
    ctx.fillStyle='#dba876'; ctx.fillRect(-p*6, -p*18, p*3, p*6);

    ctx.save(); ctx.translate(p*5, -p*20); ctx.rotate(0.5);
    ctx.fillStyle='#c87840'; ctx.fillRect(-p*1.5, -p*18, p*3, p*26);
    ctx.fillStyle='#a05820'; ctx.fillRect(-p*2.5, -p*18, p*5, p*18);
    ctx.restore();

    ctx.fillStyle='#e8e8f0'; ctx.fillRect(p*2, -p*25, p*4, p*7);
    ctx.fillStyle='#dba876'; ctx.fillRect(p*3, -p*18, p*3, p*6);

    ctx.fillStyle='#1a1a55';
    ctx.beginPath();ctx.arc(0, -p*30, p*5.5, 0, Math.PI*2);ctx.fill();
    ctx.fillRect(p*2, -p*32, p*5, p*3); 
  }

  ctx.restore();
}

function drawCatcher(cx,cy){
  const p=Math.max(1.5, canvas.width/180);
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));

  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(0, p*3, p*14, p*5, 0, 0, Math.PI*2);ctx.fill();

  ctx.fillStyle='#e8e8f0';
  ctx.fillRect(-p*10, -p*6, p*7, p*8); 
  ctx.fillRect(p*3, -p*6, p*7, p*8);   
  
  ctx.fillStyle='#222';
  ctx.fillRect(-p*12, p*2, p*7, p*3); 
  ctx.fillRect(p*5, p*2, p*7, p*3); 

  ctx.fillStyle='#222'; 
  ctx.fillRect(-p*8, -p*20, p*16, p*14);
  
  ctx.strokeStyle='#555577';
  ctx.lineWidth=p*2.5;
  ctx.beginPath(); ctx.moveTo(-p*7, -p*19); ctx.lineTo(p*7, -p*8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p*7, -p*19); ctx.lineTo(-p*7, -p*8); ctx.stroke();
  ctx.fillStyle='#8888cc'; ctx.fillRect(-p*3, -p*16, p*6, p*5); 

  ctx.fillStyle='#6b3a1f';
  ctx.beginPath();ctx.ellipse(-p*9, -p*20, p*5, p*4, 0, 0, Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a2810';
  ctx.beginPath();ctx.ellipse(-p*9, -p*20, p*3, p*2, 0, 0, Math.PI*2);ctx.fill();

  ctx.fillStyle='#1a1a55';
  ctx.beginPath();ctx.arc(0, -p*23, p*6, 0, Math.PI*2);ctx.fill();
  ctx.fillRect(-p*4, -p*20, p*8, p*4); 

  ctx.restore();
}

function drawPitchHUD(W,H){
  if(!curPitch)return;
  ctx.fillStyle='rgba(0,0,0,.80)';ctx.fillRect(W*.5-62,H*.030,124,22);
  ctx.fillStyle=curPitch.col;ctx.font="8px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText(curPitch.name+'   '+curPitch.mph+'MPH',W*.5,H*.030+15);
  ctx.textAlign='left';
  ctx.font="6px 'Press Start 2P'";ctx.fillStyle='#888';ctx.fillText('P',6,H-10);
  for(let i=0;i<10;i++){
    const r=pitchResults[i];
    ctx.fillStyle=r?(r.r==='hr'?C.gold:r.r==='fly'?C.green:r.r==='foul'?'#ffaa00':C.red):'#222244';
    ctx.beginPath();ctx.arc(20+i*22,H-13,7,0,Math.PI*2);ctx.fill();
    if(r&&r.d>0&&r.r==='hr'){
      ctx.fillStyle='#000';ctx.font="4px 'Press Start 2P'";ctx.textAlign='center';
      ctx.fillText(r.d,20+i*22,H-9);ctx.textAlign='left';ctx.font="6px 'Press Start 2P'";
    }
  }
}

// ── STADIUM VIEW (Progressive Field) ─────────────────────────
function drawStadium(dt){
  const g=gStad();
  const{W,H,px:plateX,py:plateY,wall,s1x,s1y,s2x,s2y,s3x,s3y,mx,my}=g;
  // hz = approximate screen Y of the outfield wall cap (used for grass gradient, stripes)
  const hz=wall[2].y - wall[2].h; // CF wall top as reference horizon

  // 1. SKY & STARS
  ctx.fillStyle='#02020e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    ctx.fillStyle=i%6===0?'#ffffd0':'#ffffff55';
    ctx.fillRect(Math.round(((i*137.5)%1)*W),Math.round(((i*97.3)%1)*H*.22),i%5===0?2:1,i%5===0?2:1);
  }

  // Wall top reference — we build bleachers upward from here
  // wallTop is the screen Y of the top of the outfield wall at each X
  // We'll use a helper to get wall top Y at a given X fraction
  function wallTopY(xFrac){
    const wp=wallAt(xFrac,wall);
    return wp.y - wp.h;
  }

  // ── PROGRESSIVE FIELD BLEACHERS — 3 vertical sections on wall ─
  // Single strip height, broken into LF / CF / RF with dark gaps
  const blH = H*.075;  // height of bleacher strip
  const cfBlH = blH * 0.80; // CF section slightly shorter (batter's eye)

  const sections=[
    {x0:0.00, x1:0.34, col:'#28206a'},  // LF section
    {x0:0.38, x1:0.62, col:'#1e1458'},  // CF section (darker, shorter)
    {x0:0.66, x1:1.00, col:'#221860'},  // RF section
  ];

  sections.forEach((sec,si)=>{
    const secH = si===1 ? cfBlH : blH;
    const steps=20;

    // Section fill
    ctx.fillStyle=sec.col;
    ctx.beginPath();
    ctx.moveTo(sec.x0*W, wallTopY(sec.x0));
    for(let xi=0;xi<=steps;xi++){
      const xf=sec.x0+(sec.x1-sec.x0)*(xi/steps);
      ctx.lineTo(xf*W, wallTopY(xf));
    }
    for(let xi=steps;xi>=0;xi--){
      const xf=sec.x0+(sec.x1-sec.x0)*(xi/steps);
      ctx.lineTo(xf*W, wallTopY(xf)-secH);
    }
    ctx.closePath();ctx.fill();

    // Seat row lines
    for(let row=1;row<4;row++){
      ctx.strokeStyle='rgba(40,30,100,.55)';ctx.lineWidth=1;ctx.setLineDash([]);
      ctx.beginPath();
      for(let xi=0;xi<=steps;xi++){
        const xf=sec.x0+(sec.x1-sec.x0)*(xi/steps);
        const y=wallTopY(xf)-secH*(row/4);
        xi===0?ctx.moveTo(xf*W,y):ctx.lineTo(xf*W,y);
      }
      ctx.stroke();
    }

    // Fans
    for(let fi=0;fi<100;fi++){
      const p=CROWD[(si*100+fi)%CROWD.length];
      const xf=sec.x0+0.01+(p.rx*(sec.x1-sec.x0-0.02));
      const baseY=wallTopY(xf);
      const fanY=baseY - p.ry*secH*0.88;
      const pw=3,ph=6;
      const fx=Math.round(xf*W);const fy=Math.round(fanY);
      ctx.fillStyle=p.shirt;ctx.fillRect(fx,fy-Math.round(ph*.6),pw,Math.round(ph*.6));
      ctx.fillStyle=p.skin; ctx.fillRect(fx,fy-Math.round(ph*.8),pw,Math.round(ph*.2));
      ctx.fillStyle=p.hat;  ctx.fillRect(fx,fy-ph,pw,Math.round(ph*.2));
      if(celebrating&&fi%4===0){ctx.fillStyle=p.shirt;ctx.fillRect(fx-pw,fy-Math.round(ph*.5),pw,2);ctx.fillRect(fx+pw,fy-Math.round(ph*.5),pw,2);}
    }
  });

  // Bleacher top Y for skyline/scoreboard positioning
  function bleacherTopY(xFrac){
    const si=xFrac<0.34?0:xFrac<0.62?1:2;
    const secH=si===1?cfBlH:blH;
    return wallTopY(xFrac)-secH;
  }

  // ── CLEVELAND CITY SKYLINE ────────────────────────────────────
  // Buildings visible above upper deck — dark silhouettes against night sky
  // Progressive Field is in downtown Cleveland; skyline visible in CF/RF
  const skyBase=(xf)=>bleacherTopY(xf);

  // Fill sky blue-black behind skyline
  ctx.fillStyle='#050518';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);
  ctx.lineTo(W,skyBase(1));
  for(let xi=20;xi>=0;xi--) ctx.lineTo(xi/20*W,skyBase(xi/20));
  ctx.lineTo(0,skyBase(0));ctx.closePath();ctx.fill();

  // City building silhouettes — reference Progressive Field surroundings
  // Buildings are positioned relative to bleacher top
  ctx.fillStyle='#0d0f22'; // dark navy building color
  const buildings=[
    // [xFrac, widthFrac, extraHeight] — height above bleacher top
    {x:.08, w:.06, h:18, spire:8},   // LF area building
    {x:.16, w:.04, h:28, spire:0},   // taller office building
    {x:.22, w:.05, h:14, spire:0},
    {x:.44, w:.08, h:38, spire:12},  // Key Tower (tallest Cleveland building) CF-left
    {x:.50, w:.05, h:30, spire:0},   // 200 Public Square
    {x:.57, w:.06, h:22, spire:0},
    {x:.64, w:.04, h:16, spire:0},
    {x:.72, w:.05, h:20, spire:6},
    {x:.80, w:.04, h:12, spire:0},
    {x:.88, w:.06, h:18, spire:0},
  ];
  buildings.forEach(b=>{
    const bx=b.x*W;
    const by=skyBase(b.x+b.w/2); // base at bleacher top
    ctx.fillStyle='#0d0f22';
    ctx.fillRect(bx, by-b.h, b.w*W, b.h);
    // Windows (tiny lit squares)
    ctx.fillStyle='rgba(255,230,120,.55)';
    for(let wy=4;wy<b.h-4;wy+=5){
      for(let wx=3;wx<b.w*W-3;wx+=4){
        if(Math.random()>.35) ctx.fillRect(bx+wx,by-b.h+wy,2,2);
      }
    }
    // Spire
    if(b.spire>0){
      ctx.fillStyle='#0d0f22';
      ctx.fillRect(bx+b.w*W/2-1, by-b.h-b.spire, 2, b.spire);
    }
  });

  // ── PROGRESSIVE FIELD SCOREBOARD (Left field, iconic) ─────────
  // Large video board in LF, sits just above the LF wall/bleachers
  const sbBaseY=bleacherTopY(.12);
  const sbW=W*.30, sbH=H*.090;
  const sbX=W*.02;
  const sbY=sbBaseY-sbH-4;
  // Board frame
  ctx.fillStyle='#111';ctx.fillRect(sbX,sbY,sbW,sbH);
  ctx.strokeStyle='#c41e3a';ctx.lineWidth=3;ctx.strokeRect(sbX,sbY,sbW,sbH);
  // Screen (dark green video board look)
  ctx.fillStyle='#081808';ctx.fillRect(sbX+3,sbY+3,sbW-6,sbH-6);
  // Scoreboard content
  ctx.fillStyle='#ff4444';ctx.font="5px 'Press Start 2P'";
  ctx.fillText('PROGRESSIVE',sbX+6,sbY+12);
  ctx.fillStyle='#ffcc00';ctx.font="4px 'Press Start 2P'";
  ctx.fillText('FIELD',sbX+6,sbY+20);
  // Score line
  ctx.fillStyle='#44ff88';ctx.font="4px 'Press Start 2P'";
  ctx.fillText('CLE  '+hrCount+'  HR',sbX+6,sbY+32);
  // Small graphic dots (pixel LED board effect)
  ctx.fillStyle='rgba(255,80,80,.3)';
  for(let di=0;di<12;di++) ctx.fillRect(sbX+6+di*5,sbY+sbH-10,3,4);

  // Board support structure
  ctx.fillStyle='#333';ctx.fillRect(sbX+sbW*.3,sbY+sbH,4,12);
  ctx.fillRect(sbX+sbW*.7,sbY+sbH,4,12);

  // 6. STADIUM LIGHTS — tall poles rising from upper concourse area
  [{x:.06,h:55},{x:.30,h:45},{x:.70,h:45},{x:.94,h:55}].forEach(lp=>{
    const lx=W*lp.x;
    const poleBase=bleacherTopY(lp.x); // rises from top of bleachers
    const ly=poleBase-lp.h;
    ctx.fillStyle='#555';ctx.fillRect(lx-2,ly,4,lp.h);
    ctx.fillStyle='rgba(255,255,200,.95)';ctx.fillRect(lx-10,ly-5,20,5);
    const lg=ctx.createRadialGradient(lx,ly,1,lx,ly+25,82);
    lg.addColorStop(0,'rgba(255,255,200,.16)');lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,ly+25,82,0,Math.PI*2);ctx.fill();
  });

  // 7. FIELD GRASS (Starts at the BASE of the wall)
  const fg=ctx.createLinearGradient(0,hz,0,H);
  fg.addColorStop(0,'#1a5c1a');fg.addColorStop(.4,'#1e681e');fg.addColorStop(1,'#0e3a0e');
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(wall[0].x,wall[0].y);
  for(let i=1;i<wall.length;i++) ctx.lineTo(wall[i].x,wall[i].y);
  ctx.lineTo(W+10,H+10);ctx.lineTo(-10,H+10);ctx.closePath();ctx.fill();

  for(let i=0;i<14;i++){
    const sy1=hz+(H-hz)*(i/14),sy2=hz+(H-hz)*((i+.5)/14);
    ctx.fillStyle=i%2===0?'rgba(30,110,30,.17)':'rgba(10,55,10,.10)';
    ctx.fillRect(0,sy1,W,sy2-sy1);
  }

  // 8. WARNING TRACK (Mapped to base of wall)
  ctx.fillStyle='rgba(110,75,40,.58)';
  ctx.beginPath();
  ctx.moveTo(wall[0].x,wall[0].y);
  for(let i=1;i<wall.length;i++)ctx.lineTo(wall[i].x,wall[i].y);
  for(let i=wall.length-1;i>=0;i--)ctx.lineTo(wall[i].x,wall[i].y+28);
  ctx.closePath();ctx.fill();

  // 9. OUTFIELD WALL FACE (Draws upward from the base)
  ctx.fillStyle='#174d17';
  ctx.beginPath();
  ctx.moveTo(wall[0].x,wall[0].y);
  for(let i=1;i<wall.length;i++)ctx.lineTo(wall[i].x,wall[i].y);
  for(let i=wall.length-1;i>=0;i--)ctx.lineTo(wall[i].x,wall[i].y-wall[i].h);
  ctx.closePath();ctx.fill();

  for(let panel=0;panel<3;panel++){
    ctx.fillStyle=panel%2===0?'#1d5c1d':'#175217';
    ctx.beginPath();
    ctx.moveTo(wall[0].x, wall[0].y - wall[0].h + (panel/3)*wall[0].h);
    for(let i=1;i<wall.length;i++) ctx.lineTo(wall[i].x, wall[i].y - wall[i].h + (panel/3)*wall[i].h);
    for(let i=wall.length-1;i>=0;i--) ctx.lineTo(wall[i].x, wall[i].y - wall[i].h + ((panel+1)/3)*wall[i].h);
    ctx.closePath();ctx.fill();
  }

  // 10. WALL CAP & DISTANCE MARKERS
  ctx.strokeStyle='#ffffff';ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(wall[0].x, wall[0].y - wall[0].h);
  for(let i=1;i<wall.length;i++) ctx.lineTo(wall[i].x, wall[i].y - wall[i].h);
  ctx.stroke();

  ctx.font="7px 'Press Start 2P'";ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.90)';
  wall.forEach(w2=>{if(w2.ft) ctx.fillText(w2.ft,w2.x,w2.y-w2.h+15);});
  ctx.textAlign='left';

  // 11. FOUL POLES
  ctx.fillStyle='#ffff00';
  ctx.fillRect(wall[1].x-1,wall[1].y-wall[1].h-52,3,54+wall[1].h);
  ctx.fillRect(wall[7].x-1,wall[7].y-wall[7].h-52,3,54+wall[7].h);

  // 12. FOUL LINES & FOUL FANS
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(plateX,plateY);ctx.lineTo(wall[1].x,wall[1].y+22);ctx.stroke();
  ctx.beginPath();ctx.moveTo(plateX,plateY);ctx.lineTo(wall[7].x,wall[7].y+22);ctx.stroke();

  FOUL_FANS.forEach(f=>{
    const t=f.r;
    let fx,fy;
    if(f.cIdx<30){
      fy=plateY-t*(plateY-(wall[1].y+22));
      const lx=plateX-t*(plateX-wall[1].x);
      const sp=lx/30;
      fx=f.cIdx*sp+((f.r*28)%2)*2;
      if(fx>lx-2)return;
    } else {
      fy=plateY-t*(plateY-(wall[7].y+22));
      const rx=plateX+t*(wall[7].x-plateX);
      const sp=(W-rx)/30;
      fx=rx+(f.cIdx-30)*sp+((f.r*28)%2)*2;
      if(fx<rx+2||fx>W-2)return;
    }
    const sc=0.35+(fy/H)*0.65;
    const pw=Math.max(2,Math.round(3*sc)),ph=Math.max(3,Math.round(8*sc));
    ctx.fillStyle=f.shirt; ctx.fillRect(fx,fy-Math.round(ph*.6),pw,Math.round(ph*.6));
    ctx.fillStyle=f.skin; ctx.fillRect(fx,fy-Math.round(ph*.8),pw,Math.round(ph*.2));
    ctx.fillStyle='#111'; ctx.fillRect(fx,fy-Math.round(ph*1.0),pw,Math.round(ph*.2));
  });

  // 13. INFIELD
  ctx.fillStyle='#7a5030';
  ctx.beginPath();ctx.moveTo(plateX,plateY-3);
  ctx.lineTo(s1x+8,s1y);ctx.lineTo(s2x,s2y-5);ctx.lineTo(s3x-8,s3y);ctx.closePath();ctx.fill();

  ctx.fillStyle='#8b6040';
  ctx.beginPath();ctx.ellipse((plateX+s2x)/2,(plateY+s2y)/2,W*.17,(plateY-s2y)*.52,0,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(plateX,plateY);ctx.lineTo(s1x,s1y);ctx.lineTo(s2x,s2y);ctx.lineTo(s3x,s3y);ctx.lineTo(plateX,plateY);ctx.stroke();

  const bs=Math.max(5,canvas.width/58);ctx.fillStyle='#fff';
  ctx.fillRect(s2x-bs/2,s2y-bs/2,bs,bs);
  ctx.fillRect(s1x-bs/2,s1y-bs/2,bs,bs);
  ctx.fillRect(s3x-bs/2,s3y-bs/2,bs,bs);

  ctx.fillStyle='#9a7050';
  ctx.beginPath();ctx.ellipse(mx,my,W*.024,W*.013,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#eee';ctx.fillRect(mx-4,my-1,8,2);
  drawPitcherSmall(mx,my);

  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(plateX,plateY-5);ctx.lineTo(plateX+5,plateY);
  ctx.lineTo(plateX+5,plateY+5);ctx.lineTo(plateX-5,plateY+5);ctx.lineTo(plateX-5,plateY);ctx.closePath();ctx.fill();

  // 14. CONFETTI & BALL
  confetti.forEach(p=>{
    ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x*W),Math.round(p.y*H),3,3);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.6*dt;p.life-=.012;
  });
  confetti=confetti.filter(p=>p.life>0);

  if(!flightLanded){
    flightTime+=dt;
    const tPct=Math.min(flightTime/fb.duration,1);

    if(!fb.lx){
      if(fb.isFoul){
        const goL=fb.angle<.15;
        fb.lx=goL?(plateX-90-Math.random()*70):(plateX+90+Math.random()*70);
        fb.ly=plateY-H*.12-Math.random()*H*.06;
      } else {
        const wp=wallAt(fb.angle,wall);
        fb.lx=wp.x;
        // Map landing to wall Top, not wall Base
        fb.ly=fb.isHR?(wp.y-wp.h-10-Math.floor(Math.random()*20))
          :(plateY-(plateY-wp.y-10)*Math.max(0,Math.min(1,(fb.dist-50)/380)));
      }
    }

    const bx=plateX+(fb.lx-plateX)*tPct;
    const ly2=plateY+(fb.ly-plateY)*tPct;
    const arcH=fb.isFoul?H*.10:Math.min(H*.44,fb.dist*.20);
    const by=ly2-arcH*Math.sin(tPct*Math.PI);
    const bSz=Math.max(1.5,6-tPct*3.8);

    ctx.fillStyle=`rgba(0,0,0,${.08+tPct*.28})`;
    ctx.beginPath();ctx.ellipse(bx,plateY+(fb.ly-plateY)*tPct,bSz*2,bSz*.6,0,0,Math.PI*2);ctx.fill();
    ctx.shadowColor='#ffffd0';ctx.shadowBlur=8;
    ctx.fillStyle='#f5f5d8';ctx.beginPath();ctx.arc(bx,by,bSz,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;

    if(tPct>=1){
      flightLanded=true;
      if(fb.isFoul){
        setFlash('FOUL BALL!','#ffaa00');
        setTimeout(()=>{phase='result';showPitchResult();},700);
      } else if(fb.isHR){
        totalDist+=fb.dist;hrCount++;updBot();
        setFlash('HOME RUN!!!',C.gold);
        spawnConfetti();celebrating=true;
        setTimeout(()=>{phase='result';showPitchResult();},1000);
      } else {
        setFlash('DEEP FLY BALL',C.green);
        setTimeout(()=>{phase='result';showPitchResult();},700);
      }
    }
  }

  if(flightLanded){
    const last=pitchResults[pitchResults.length-1];
    if(last){
      ctx.fillStyle='rgba(0,0,0,.80)';ctx.fillRect(0,0,W,30);
      if(last.r==='hr'){ctx.fillStyle='rgba(255,200,0,.10)';ctx.fillRect(0,0,W,30);}
      const rcol=last.r==='hr'?C.gold:last.r==='foul'?'#ffaa00':C.green;
      const rtxt=last.r==='hr'?'HOME RUN!!!':last.r==='foul'?'FOUL BALL!':'DEEP FLY BALL';
      ctx.fillStyle=rcol;ctx.font="9px 'Press Start 2P'";ctx.textAlign='center';
      ctx.fillText(rtxt,W*.38,19);
      if(last.d>0){ctx.fillStyle='#fff';ctx.font="8px 'Press Start 2P'";ctx.fillText(last.d+' FT',W*.76,19);}
      if(last.r==='fly'){ctx.fillStyle='#888';ctx.font="5px 'Press Start 2P'";ctx.textAlign='right';ctx.fillText('NO SCORE',W-5,28);}
      ctx.textAlign='left';
    }
  }

  ctx.font="6px 'Press Start 2P'";ctx.fillStyle='#888';ctx.fillText('P',6,H-10);
  for(let i=0;i<10;i++){
    const r=pitchResults[i];
    ctx.fillStyle=r?(r.r==='hr'?C.gold:r.r==='fly'?C.green:r.r==='foul'?'#ffaa00':C.red):'#222244';
    ctx.beginPath();ctx.arc(20+i*22,H-13,7,0,Math.PI*2);ctx.fill();
    if(r&&r.d>0&&r.r==='hr'){
      ctx.fillStyle='#000';ctx.font="4px 'Press Start 2P'";ctx.textAlign='center';
      ctx.fillText(r.d,20+i*22,H-9);ctx.textAlign='left';ctx.font="6px 'Press Start 2P'";
    }
  }
  drawFlash(W,H,.22);
}

function drawPitcherSmall(cx,cy){
  const s=Math.max(1,Math.floor(canvas.width/175));
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));
  ctx.fillStyle='#cc2222';ctx.fillRect(-s,-s*6,s*2,s);ctx.fillRect(-s*1.5,-s*5,s*3,s);
  ctx.fillStyle='#dba876';ctx.fillRect(-s,-s*4,s*2,s*2);
  ctx.fillStyle='#dddddd';ctx.fillRect(-s*1.5,-s*2,s*3,s*4);
  ctx.fillStyle='#888';ctx.fillRect(-s*1.5,s*2,s,s*3);ctx.fillRect(s*.5,s*2,s,s*3);
  ctx.restore();
}

function drawFlash(W,H,yF){
  if(flashAlpha<=0)return;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W*.05,H*yF-16,W*.9,28);
  ctx.fillStyle=flashCol;ctx.font="11px 'Press Start 2P'";
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=flashCol;ctx.shadowBlur=18;
  ctx.fillText(flashMsg,W*.5,H*yF);
  ctx.shadowBlur=0;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.restore();
  flashAlpha=Math.max(0,flashAlpha-.014);
}

function showPitchResult(){
  setTimeout(()=>{if(pitchNum>=10)showSummary();else startPitch();},1600);
}

function showSummary(){
  phase='summary';
  let rows='';
  pitchResults.forEach(r=>{
    const col=r.r==='hr'?'#ffcc00':r.r==='fly'?'#44ff88':r.r==='foul'?'#ffaa00':'#ff4444';
    const lbl=r.r==='hr'?'HR':r.r==='fly'?'FLY':r.r==='foul'?'FOL':'OUT';
    rows+=`<span style="color:${col}">${lbl}${r.r==='hr'?' '+r.d:''}</span>&nbsp;&nbsp;`;
  });
  const rating=totalDist>=4000?'★★★ LEGEND':totalDist>=2800?'★★ ALL-STAR':totalDist>=1500?'★ SLUGGER':'ROOKIE';
  const rcol=totalDist>=4000?'#ffcc00':totalDist>=2800?'#44ff88':'#54ffff';
  showOv(`
    <div class="ov-title" style="font-size:13px">DERBY OVER!</div>
    <div class="ov-sub">PITCH BY PITCH</div>
    <div style="font-size:7px;line-height:2.8;text-align:center;padding:0 6px">${rows}</div>
    <div style="text-align:center;margin:10px 0">
      <div style="font-size:8px;color:#b8a8ff;letter-spacing:1px">HOME RUNS</div>
      <div style="font-size:26px;color:#ffcc00;text-shadow:2px 2px 0 #4a3fa0;margin:3px 0">${hrCount}</div>
      <div style="font-size:8px;color:#b8a8ff;letter-spacing:1px">TOTAL HR DISTANCE</div>
      <div style="font-size:16px;color:#54ffff;margin:3px 0">${totalDist} FT</div>
      <div style="font-size:11px;color:${rcol};margin-top:8px;text-shadow:2px 2px 0 #000">${rating}</div>
    </div>
    <button class="big-btn" onclick="resetGame()">PLAY AGAIN</button>
  `);
}

function resetGame(){
  pitchNum=0;totalDist=0;hrCount=0;pitchResults=[];
  curPitch=null;swingTime=null;swingResult=null;
  batterSwing=false;confetti=[];flashAlpha=0;celebrating=false;
  phase='idle';updBot();hideOv();showStart();
}

function showStart(){
  showOv(`
    <div class="ov-title">HOMERUN<br>PITCH</div>
    <div class="ov-sub">32953.COM · HOME RUN DERBY</div>
    <div class="ov-rule">
      tap <span>READY FOR PITCH</span> to set<br>
      then tap to <span>SWING</span><br>&nbsp;<br>
      <span>YELLOW ZONE</span> = HOME RUN<br>
      green zone = fly ball (no score)<br>
      outside = foul ball or miss<br>&nbsp;<br>
      <span>FASTBALL</span> 100mph — tightest<br>
      <span>CHANGEUP</span> 90mph — medium<br>
      <span>CURVEBALL</span> 80mph — breaks away<br>&nbsp;<br>
      <span>10 PITCHES</span> · only HRs score!
    </div>
    <button class="big-btn" onclick="startDerby()">BATTER UP!</button>
  `);
}

function startDerby(){hideOv();startPitch();}

canvas.addEventListener('click',handleTap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleTap();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')handleTap();});

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;if(dt<=0)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(phase==='idle'||phase==='summary'){drawIdle();return;}

  if(phase==='ready'||phase==='pitching_idle'){
    drawPitchView();
  } else if(phase==='windup'){
    windup+=dt*2.4;if(windup>=1)releasePitch();
    drawPitchView();
  } else if(phase==='pitching'){
    pitchElapsed+=dt;
    if(curPitch.name==='CURVEBALL'){
      const tp=Math.min(pitchElapsed/curPitch.travel,1);
      ballCurve=Math.sin(tp*Math.PI)*canvas.width*.055;
    }
    if(pitchElapsed>curPitch.travel+.08&&swingTime===null){
      swingTime=pitchElapsed;swingResult='miss';
      setFlash('CALLED STRIKE!',C.red);
      pitchResults.push({r:'miss',d:0});updBot();
      setTimeout(startPitch,1400);phase='pitching_idle';
    }
    drawPitchView();
  } else if(phase==='ballFlight'||phase==='result'){
    if(batterSwing)batterSwingT+=dt;
    drawStadium(dt);
  }
  if(batterSwing&&phase!=='ballFlight'&&phase!=='result')batterSwingT+=dt;
}

function drawIdle(){
  const W=canvas.width,H=canvas.height;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#020210');g.addColorStop(1,'#0a1528');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    ctx.fillStyle='#ffffff44';
    ctx.fillRect(Math.round(((i*137.5)%1)*W),Math.round(((i*97.3)%1)*H*.7),1,1);
  }
}

resize();lastTime=performance.now();requestAnimationFrame(loop);showStart();
</script>
</body>
