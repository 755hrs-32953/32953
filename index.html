<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>32953.COM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root {
    --c64-blue:   #3568b4;
    --c64-purple: #7b68ee;
    --c64-dark:   #4a3fa0;
    --c64-yellow: #ffff54;
    --c64-white:  #ffffff;
    --c64-green:  #54ff54;
    --c64-red:    #ff5454;
    --c64-cyan:   #54ffff;
    --c64-grey:   #2a3a6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }

  html, body {
    width:100%; height:100%;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P', monospace;
  }

  #app {
    width:min(420px, 100vw);
    min-height:100vh;
    min-height:100dvh;
    background:var(--c64-blue);
    display:flex;
    flex-direction:column;
    border-left:4px solid var(--c64-dark);
    border-right:4px solid var(--c64-dark);
  }

  /* TITLE BAR */
  #titlebar {
    background:var(--c64-purple);
    border-bottom:4px solid var(--c64-dark);
    padding:10px 8px 8px;
    text-align:center;
    flex-shrink:0;
  }
  #title {
    font-size:clamp(14px,5vw,22px);
    color:var(--c64-white);
    letter-spacing:4px;
    text-shadow:3px 3px 0 var(--c64-dark);
  }
  #subtitle {
    font-size:clamp(5px,1.8vw,7px);
    color:#b8a8ff;
    letter-spacing:2px;
    margin-top:5px;
    display:block;
  }

  /* DATE BAR */
  #daybanner {
    background:var(--c64-dark);
    padding:4px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
    font-size:clamp(4px,1.5vw,6px);
    color:#b8a8ff;
    letter-spacing:1px;
  }

  /* MAIN BODY — two game columns flanking a center leaderboard strip */
  #main {
    display:grid;
    grid-template-columns:1fr auto 1fr;
    flex:1;
  }

  /* Each game column: 5 slots stacked */
  .game-col {
    display:flex;
    flex-direction:column;
  }

  .slot {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:5px 3px 4px;
    border:1px solid rgba(255,255,255,0.08);
    cursor:default;
    transition:background 0.05s;
    flex:1;
  }
  .slot.active { cursor:pointer; }
  .slot.active:hover  { background:rgba(255,255,255,0.07); }
  .slot.active:active { background:rgba(255,255,255,0.14); }

  .game-name {
    font-size:clamp(5px,1.8vw,7px);
    color:var(--c64-yellow);
    letter-spacing:1px;
    text-align:center;
    text-shadow:1px 1px 0 #000;
    line-height:1.4;
    flex-shrink:0;
  }
  .slot:not(.active) .game-name { color:#888; }

  .icon-wrap {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px 0;
  }

  .game-score {
    font-size:clamp(5px,1.8vw,8px);
    color:var(--c64-green);
    letter-spacing:1px;
    text-align:center;
    text-shadow:1px 1px 0 #000;
    flex-shrink:0;
  }
  .game-score.coming-soon {
    color:#555;
    font-size:clamp(4px,1.4vw,6px);
    animation:blink 1.2s step-end infinite;
  }

  /* TOTAL BAR */
  #scorebar {
    background:var(--c64-purple);
    border-top:4px solid var(--c64-dark);
    border-bottom:2px solid var(--c64-dark);
    padding:6px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
  }
  #score-label {
    font-size:clamp(5px,1.8vw,8px);
    color:var(--c64-white);
    letter-spacing:2px;
  }
  #total-score {
    font-size:clamp(8px,2.5vw,14px);
    color:var(--c64-yellow);
    letter-spacing:2px;
    text-shadow:2px 2px 0 var(--c64-dark);
  }
  #ace-note {
    font-size:clamp(3px,1.1vw,5px);
    color:#b8a8ff;
    letter-spacing:1px;
  }

  /* LEADERBOARD — center vertical strip */
  #leaderboard {
    background:var(--c64-dark);
    border-left:2px solid rgba(255,255,255,0.1);
    border-right:2px solid rgba(255,255,255,0.1);
    width:clamp(100px,34vw,130px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 4px;
    overflow:hidden;
  }
  #lb-title {
    font-size:clamp(6px,1.8vw,8px);
    color:var(--c64-cyan);
    letter-spacing:2px;
    margin-bottom:8px;
    text-align:center;
    writing-mode:horizontal-tb;
  }
  #lb-rows {
    display:flex;
    flex-direction:column;
    gap:5px;
    width:100%;
  }
  .lb-row {
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:clamp(6px,1.8vw,8px);
    color:#b8a8ff;
    letter-spacing:1px;
    padding:3px 2px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    text-align:center;
    line-height:1.8;
  }
  .lb-row .rank  { color:#7b68ee; font-size:clamp(5px,1.5vw,7px); }
  .lb-row .ini   { color:var(--c64-white); font-size:clamp(7px,2vw,9px); }
  .lb-row .pts   { color:var(--c64-green); font-size:clamp(5px,1.5vw,7px); }
  .lb-row.me .ini { color:var(--c64-yellow); }
  .lb-row.me .pts { color:var(--c64-yellow); }
  .lb-row.me { background:rgba(255,255,84,0.07); }
  .lb-row.empty {
    color:#444;
    font-size:clamp(5px,1.5vw,7px);
  }

  /* Scanlines */
  #scanlines {
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px);
    z-index:50;
  }

  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.3} }
</style>
</head>
<body>
<div id="scanlines"></div>

<div id="app">
  <div id="titlebar">
    <div id="title">32953.COM</div>
    <span id="subtitle">DAILY ARCADE — 10 MISSIONS</span>
  </div>

  <div id="daybanner">
    <span id="day-label"></span>
    <span id="day-clock"></span>
  </div>

  <div id="main">
    <div class="game-col" id="col-left"></div>
    <div id="leaderboard">
      <div id="lb-title">DAILY<br>TOP 10</div>
      <div id="lb-rows"><div class="lb-row empty">...</div></div>
    </div>
    <div class="game-col" id="col-right"></div>
  </div>

  <div id="scorebar">
    <div id="score-label">TODAY'S TOTAL</div>
    <div id="total-score">000000</div>
    <div id="ace-note">BEST SCORES</div>
  </div>


</div>


<script>
// ── Clock ────────────────────────────────────────────────────────────────────
function tick(){
  const n=new Date(), pad=v=>String(v).padStart(2,'0');
  document.getElementById('day-clock').textContent=
    pad(n.getUTCHours())+':'+pad(n.getUTCMinutes())+':'+pad(n.getUTCSeconds())+' UTC';
}
setInterval(tick,1000); tick();
const nd=new Date();
document.getElementById('day-label').textContent=
  nd.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();

// ── Games ────────────────────────────────────────────────────────────────────
const GAMES=[
  {name:'LUNAR LANDER', id:'lunar-lander',  url:'lunar-lander.html', active:true,  score:0, iconFn:'iconLunarLander'},
  {name:'STONE COLD',   id:'stone-cold',    url:'stone-cold.html',   active:true,  score:0, iconFn:'iconCurling'},
  {name:'FAIR WAY',     id:'fairway',       url:'fairway.html',      active:true,  score:0, iconFn:'iconGolf'},
  {name:'DOWN TOWN',    id:'downtown',      url:'downtown.html',     active:true,  score:0, iconFn:'iconBasketball'},
  {name:'SPLASH',       id:'splash',        url:'splash.html',       active:true,  score:0, iconFn:'iconSwim'},
  {name:'HOMERUN PITCH',id:'homerun-pitch', url:'homerun-pitch.html',active:true,  score:0, iconFn:'iconBaseball'},
  {name:'ASTEROID RUN', id:'asteroid-run',  url:'#',                 active:false, score:0, iconFn:'iconAsteroid'},
  {name:'JUNGLE RUN',   id:'jungle-run',    url:'#',                 active:false, score:0, iconFn:'iconJungle'},
  {name:'DOGFIGHT',     id:'dogfight',      url:'#',                 active:false, score:0, iconFn:'iconPlane'},
  {name:'GOLD RUSH',    id:'gold-rush',     url:'#',                 active:false, score:0, iconFn:'iconGold'},
];

// ── Icon painters ─────────────────────────────────────────────────────────────
function px(ctx, col, x, y, w, h) {
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w || 1, h || 1);
}

function iconLunarLander(ctx, s) {
  const u = s/16;
  // Body
  px(ctx,'#ffff54', 6*u,3*u,4*u,4*u);
  px(ctx,'#ffff54', 5*u,4*u,6*u,3*u);
  // Cockpit window
  px(ctx,'#54ffff', 7*u,4*u,2*u,2*u);
  // Legs
  px(ctx,'#ffff54', 4*u,7*u,1*u,3*u);
  px(ctx,'#ffff54', 3*u,9*u,2*u,1*u);
  px(ctx,'#ffff54', 11*u,7*u,1*u,3*u);
  px(ctx,'#ffff54', 11*u,9*u,2*u,1*u);
  // Engine / nozzle
  px(ctx,'#aaa',   6*u,7*u,4*u,1*u);
  px(ctx,'#aaa',   7*u,8*u,2*u,1*u);
  // Flame
  px(ctx,'#ff8800',7*u,9*u,2*u,2*u);
  px(ctx,'#ffff54',7*u,10*u,2*u,1*u);
  px(ctx,'#ff4400',7*u,11*u,2*u,1*u);
  // Stars
  px(ctx,'#fff', 1*u,1*u,u,u);
  px(ctx,'#fff', 13*u,2*u,u,u);
  px(ctx,'#fff', 2*u,5*u,u,u);
  px(ctx,'#fff', 14*u,6*u,u,u);
}

function iconCar(ctx, s) {
  const u = s/16;
  // Road
  px(ctx,'#555', 0,11*u,16*u,2*u);
  px(ctx,'#ffff54', 3*u,11.5*u,2*u,u);
  px(ctx,'#ffff54', 7*u,11.5*u,2*u,u);
  px(ctx,'#ffff54', 11*u,11.5*u,2*u,u);
  // Car body
  px(ctx,'#ff5454', 2*u,8*u,12*u,3*u);
  px(ctx,'#ff5454', 4*u,6*u,8*u,3*u);
  // Windows
  px(ctx,'#54ffff', 5*u,6.5*u,2.5*u,2*u);
  px(ctx,'#54ffff', 8.5*u,6.5*u,2.5*u,2*u);
  // Wheels
  px(ctx,'#222', 3*u,10*u,3*u,3*u);
  px(ctx,'#222', 10*u,10*u,3*u,3*u);
  px(ctx,'#888', 3.5*u,10.5*u,2*u,2*u);
  px(ctx,'#888', 10.5*u,10.5*u,2*u,2*u);
  // Headlight
  px(ctx,'#ffff54', 13*u,9*u,u,u);
  // Eiffel tower tiny
  px(ctx,'#ffff54', 1*u,3*u,u,5*u);
  px(ctx,'#ffff54', 1.5*u,4*u,u,u);
  px(ctx,'#ffff54', 0.5*u,6*u,2*u,u);
}

function iconSub(ctx, s) {
  const u = s/16;
  // Water
  px(ctx,'#2038a0', 0,10*u,16*u,6*u);
  px(ctx,'#54b4ff', 0,9*u,16*u,u);
  // Sub body
  px(ctx,'#54ff54', 2*u,6*u,12*u,4*u);
  // Rounded ends
  px(ctx,'#54ff54', 1*u,7*u,u,2*u);
  px(ctx,'#54ff54', 14*u,7*u,u,2*u);
  // Conning tower
  px(ctx,'#54ff54', 6*u,4*u,4*u,3*u);
  // Periscope
  px(ctx,'#54ff54', 8*u,2*u,u,3*u);
  px(ctx,'#54ff54', 7*u,2*u,3*u,u);
  // Window
  px(ctx,'#54ffff', 5*u,7*u,2*u,2*u);
  // Propeller
  px(ctx,'#ffff54', 13*u,6*u,u,u);
  px(ctx,'#ffff54', 14*u,7*u,u,2*u);
  px(ctx,'#ffff54', 13*u,9*u,u,u);
  // Bubbles
  px(ctx,'#54ffff', 4*u,12*u,u,u);
  px(ctx,'#54ffff', 7*u,11*u,u,u);
  px(ctx,'#54ffff', 11*u,13*u,u,u);
}

function iconSki(ctx, s) {
  const u = s/16;
  // Sky
  px(ctx,'#54ffff', 0,0,16*u,8*u);
  // Mountain
  px(ctx,'#fff', 0,8*u,16*u,8*u);
  px(ctx,'#54b4ff', 1*u,10*u,2*u,6*u);
  px(ctx,'#54b4ff', 4*u,11*u,2*u,5*u);
  px(ctx,'#54b4ff', 8*u,9*u,3*u,7*u);
  // Skier
  px(ctx,'#ff5454', 11*u,5*u,2*u,2*u); // body
  px(ctx,'#ffcf87', 11*u,4*u,2*u,u);   // head
  px(ctx,'#ff5454', 10*u,6*u,4*u,u);   // arms
  px(ctx,'#222',    10*u,7*u,5*u,u);   // skis
  // Sun
  px(ctx,'#ffff54', 2*u,u,2*u,2*u);
  px(ctx,'#ffff54', u,2*u,u,u);
  px(ctx,'#ffff54', 4*u,2*u,u,u);
}

function iconTank(ctx, s) {
  const u = s/16;
  // Ground
  px(ctx,'#3a5a2a', 0,13*u,16*u,3*u);
  // Tracks
  px(ctx,'#222', 1*u,10*u,14*u,4*u);
  px(ctx,'#444', 2*u,11*u,12*u,2*u);
  for(let i=0;i<6;i++) px(ctx,'#666', (2+i*2)*u,10*u,u,4*u);
  // Body
  px(ctx,'#6a8a4a', 2*u,7*u,12*u,4*u);
  // Turret
  px(ctx,'#5a7a3a', 4*u,4*u,8*u,4*u);
  // Barrel
  px(ctx,'#4a6a2a', 10*u,5*u,5*u,2*u);
  // Hatch
  px(ctx,'#3a5a1a', 6*u,3*u,4*u,2*u);
  // Star
  px(ctx,'#ff5454', 7*u,4.5*u,2*u,u);
  px(ctx,'#ff5454', 7.5*u,4*u,u,2*u);
}

function iconAsteroid(ctx, s) {
  const u = s/16;
  // Space background - stars
  px(ctx,'#fff', u,u,u,u);
  px(ctx,'#fff', 13*u,2*u,u,u);
  px(ctx,'#fff', 4*u,4*u,u,u);
  px(ctx,'#fff', 14*u,10*u,u,u);
  px(ctx,'#fff', 2*u,12*u,u,u);
  px(ctx,'#fff', 10*u,13*u,u,u);
  // Asteroid (chunky rock)
  px(ctx,'#a07840', 4*u,3*u,8*u,2*u);
  px(ctx,'#a07840', 2*u,5*u,12*u,5*u);
  px(ctx,'#a07840', 4*u,10*u,8*u,2*u);
  px(ctx,'#7a5820', 3*u,4*u,2*u,u);
  px(ctx,'#7a5820', 10*u,7*u,2*u,u);
  px(ctx,'#7a5820', 5*u,9*u,2*u,u);
  // Spaceship
  px(ctx,'#54ffff', 12*u,u,2*u,4*u);
  px(ctx,'#54ffff', 11*u,2*u,4*u,2*u);
  px(ctx,'#ffff54', 13*u,5*u,u,u); // thrust
  px(ctx,'#ff8800', 13*u,6*u,u,u);
}

function iconJungle(ctx, s) {
  const u = s/16;
  // Ground
  px(ctx,'#2a6a1a', 0,12*u,16*u,4*u);
  // Trees
  px(ctx,'#1a8a1a', 0,6*u,4*u,6*u);
  px(ctx,'#2aaa2a', u,4*u,3*u,4*u);
  px(ctx,'#1a8a1a', 12*u,5*u,4*u,7*u);
  px(ctx,'#2aaa2a', 13*u,3*u,3*u,4*u);
  px(ctx,'#1a8a1a', 6*u,7*u,4*u,5*u);
  // Trunk
  px(ctx,'#7a4a1a', u,10*u,2*u,4*u);
  px(ctx,'#7a4a1a', 13*u,10*u,2*u,4*u);
  // Character (pitfall-style)
  px(ctx,'#ff8800', 7*u,7*u,2*u,2*u); // head
  px(ctx,'#ffcf87', 7*u,6*u,2*u,u);   // hat
  px(ctx,'#ff8800', 6*u,9*u,4*u,3*u); // body
  px(ctx,'#ffcf87', 6*u,10*u,u,2*u);  // arm
  px(ctx,'#ffcf87', 9*u,10*u,u,2*u);  // arm
  px(ctx,'#ff8800', 7*u,12*u,u,2*u);  // leg
  px(ctx,'#ff8800', 8*u,12*u,u,2*u);  // leg
  // Vine
  px(ctx,'#2aaa2a', 5*u,2*u,u,6*u);
}

function iconPlane(ctx, s) {
  const u = s/16;
  // Sky / clouds
  px(ctx,'#54b4ff', 0,0,16*u,16*u);
  px(ctx,'#fff', u,2*u,3*u,2*u);
  px(ctx,'#fff', 0,3*u,4*u,u);
  px(ctx,'#fff', 11*u,10*u,4*u,2*u);
  px(ctx,'#fff', 12*u,9*u,3*u,u);
  // Plane body
  px(ctx,'#ffff54', 3*u,6*u,10*u,3*u);
  // Nose
  px(ctx,'#ffff54', 12*u,7*u,3*u,u);
  // Cockpit
  px(ctx,'#54ffff', 9*u,5*u,3*u,2*u);
  // Top wing
  px(ctx,'#ff5454', 5*u,3*u,6*u,3*u);
  px(ctx,'#dd3333', 5*u,4*u,6*u,u);
  // Bottom wing
  px(ctx,'#ff5454', 5*u,9*u,6*u,3*u);
  px(ctx,'#dd3333', 5*u,10*u,6*u,u);
  // Tail
  px(ctx,'#ff5454', 2*u,4*u,3*u,3*u);
  px(ctx,'#ff5454', 2*u,9*u,3*u,3*u);
  // Bullets
  px(ctx,'#ffff54', 13*u,6*u,2*u,u);
  px(ctx,'#ffff54', 14*u,8*u,2*u,u);
}

function iconGold(ctx, s) {
  const u = s/16;
  // Sky
  px(ctx,'#54b4ff', 0,0,16*u,8*u);
  // Mountains
  px(ctx,'#7a6a50', 0,8*u,5*u,8*u);
  px(ctx,'#9a8a60', 3*u,6*u,5*u,10*u);
  px(ctx,'#7a6a50', 10*u,7*u,6*u,9*u);
  // Ground
  px(ctx,'#8a7040', 0,12*u,16*u,4*u);
  // Gold nuggets
  px(ctx,'#ffff54', 6*u,11*u,2*u,2*u);
  px(ctx,'#ffcc00', 6.5*u,11.5*u,u,u);
  px(ctx,'#ffff54', 10*u,10*u,3*u,3*u);
  px(ctx,'#ffcc00', 10.5*u,10.5*u,2*u,2*u);
  // Miner character
  px(ctx,'#ffcf87', 2*u,7*u,2*u,2*u); // head
  px(ctx,'#fff',    2*u,6*u,3*u,u);   // hat
  px(ctx,'#5454ff', 2*u,9*u,2*u,3*u); // body
  px(ctx,'#ffcf87', u,10*u,u,2*u);    // arm
  // Pickaxe
  px(ctx,'#888',    u,9*u,2*u,u);
  px(ctx,'#ffcf87', 0,8*u,u,2*u);
}

function iconDiver(ctx, s) {
  const u = s/16;
  // Deep water background
  px(ctx,'#001060', 0,0,16*u,16*u);
  px(ctx,'#001880', 0,0,16*u,8*u);
  // Light rays
  px(ctx,'rgba(100,150,255,0.3)', 7*u,0,2*u,16*u);
  // Fish
  px(ctx,'#ffaa00', 2*u,8*u,4*u,2*u);
  px(ctx,'#ffaa00', u,9*u,u,u);
  px(ctx,'#ffaa00', 5*u,8*u,2*u,u);
  px(ctx,'#ffaa00', 5*u,9*u,2*u,u);
  px(ctx,'#222',    3*u,8*u,u,u);
  // Big fish
  px(ctx,'#ff5454', 10*u,11*u,5*u,3*u);
  px(ctx,'#ff5454', 9*u,12*u,u,u);
  px(ctx,'#ff5454', 14*u,11*u,2*u,u);
  px(ctx,'#ff5454', 14*u,13*u,2*u,u);
  px(ctx,'#222',    11*u,12*u,u,u);
  // Diver
  px(ctx,'#ffcf87', 7*u,3*u,2*u,2*u);  // head
  px(ctx,'#222',    7*u,2*u,2*u,u);    // mask
  px(ctx,'#54ffff', 7*u,2*u,2*u,u);    // visor
  px(ctx,'#3468aa', 6*u,5*u,4*u,4*u);  // suit
  px(ctx,'#ffcf87', 5*u,6*u,u,2*u);    // arm
  px(ctx,'#ffcf87', 10*u,6*u,u,2*u);   // arm

const ICON_FNS = {
  iconLunarLander, iconCurling, iconGolf, iconCar, iconSub, iconSki, iconTank,
  iconAsteroid, iconJungle, iconPlane, iconGold, iconDiver, iconBasketball, iconSwim, iconBaseball
};

// ── Build icon canvas ─────────────────────────────────────────────────────────
function makeIcon(fnName, size, active){
  const c=document.createElement('canvas');
  c.width=size; c.height=size;
  c.style.width=size+'px'; c.style.height=size+'px';
  c.style.imageRendering='pixelated';
  const cx=c.getContext('2d');
  if(!active){ cx.globalAlpha=0.28; cx.filter='grayscale(80%)'; }
  ICON_FNS[fnName](cx,size);
  return c;
}

// ── Build grid ────────────────────────────────────────────────────────────────
function buildGrid(){
  const colL=document.getElementById('col-left');
  const colR=document.getElementById('col-right');
  colL.innerHTML=''; colR.innerHTML='';
  const appW=document.getElementById('app').offsetWidth;
  const iconSize=Math.max(28, Math.min(46, Math.floor(appW*0.17)));

  GAMES.forEach((g,i)=>{
    const slot=document.createElement('div');
    slot.className='slot'+(g.active?' active':'');

    const nameEl=document.createElement('div');
    nameEl.className='game-name';
    nameEl.textContent=g.name;

    const iconWrap=document.createElement('div');
    iconWrap.className='icon-wrap';
    iconWrap.appendChild(makeIcon(g.iconFn,iconSize,g.active));

    const scoreEl=document.createElement('div');
    scoreEl.className='game-score'+(g.active?'':' coming-soon');
    scoreEl.id='score-'+i;
    scoreEl.textContent=g.active?formatScore(g.score):'COMING SOON';

    slot.appendChild(nameEl);
    slot.appendChild(iconWrap);
    slot.appendChild(scoreEl);

    if(g.active) slot.addEventListener('click',()=>{ window.location.href=g.url; });

    // Even index → left column, odd → right column
    (i%2===0 ? colL : colR).appendChild(slot);
  });

  updateTotal();
}

function formatScore(n){ return String(n).padStart(6,'0')+' PTS'; }
function updateTotal(){
  const t=GAMES.reduce((s,g)=>s+(g.active?g.score:0),0);
  document.getElementById('total-score').textContent=String(t).padStart(6,'0');
}

buildGrid();
window.addEventListener('resize',buildGrid);
</script>

<!-- Firebase — loaded after page renders -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="scores.js"></script>
<script>
// ── Load scores + leaderboard ─────────────────────────────────────────────────
async function loadHubScores(){
  try {
    const myScores=await loadMyScores();
    GAMES.forEach((g,i)=>{
      if(g.active && myScores[g.id]){
        g.score=myScores[g.id];
        const el=document.getElementById('score-'+i);
        if(el) el.textContent=formatScore(g.score);
      }
    });
    updateTotal();
    await loadHubLeaderboard();
  } catch(e){
    console.warn('Firebase load failed:',e);
    document.getElementById('lb-rows').innerHTML=
      '<div class="lb-row empty">SCORES UNAVAILABLE</div>';
  }
}

async function loadHubLeaderboard(){
  const board=await fetchLeaderboard();
  const pid=getPlayerID();
  const lbRows=document.getElementById('lb-rows');
  if(!lbRows) return;
  if(!board||board.length===0){
    lbRows.innerHTML='<div class="lb-row empty">NO SCORES YET TODAY</div>';
    return;
  }
  lbRows.innerHTML=board.map((e,i)=>{
    const isMe=e.pid===pid;
    const ini=(e.initials||'???').toUpperCase();
    const pts=String(e.total).padStart(6,'0');
    const rank=String(i+1).padStart(2,'0');
    return `<div class="lb-row${isMe?' me':''}">
      <span class="rank">${rank}.</span>
      <span class="ini">${ini}</span>
      <span class="pts">${pts}</span>
    </div>`;
  }).join('');
}

// Load scores on page open
loadHubScores();
</script>
